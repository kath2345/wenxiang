<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>极速抽盒 · WISHES COME TRUE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:#485D88; }
  body { font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color:#fff; min-height:100vh; }
  .page { max-width:640px; margin:0 auto; padding:0 14px 170px; }
  header { text-align:center; padding:26px 0 8px; }
  header h1 { font-size:30px; letter-spacing:6px; font-weight:800; }
  header h1 .bolt { color:#FFD94D; }
  header .sub { margin-top:6px; font-size:12px; letter-spacing:3px; color:rgba(255,255,255,.75); }
  header .sim { display:inline-block; margin-top:10px; font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.45); border-radius:20px; padding:3px 10px; }
  .all-title { text-align:center; margin:22px 0 4px; }
  .all-title .en { font-size:13px; letter-spacing:6px; color:rgba(255,255,255,.65); font-weight:600; }
  .all-title .cn { font-size:26px; font-weight:800; letter-spacing:8px; margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px 10px; margin-top:16px; }
  @media (min-width:700px) { .grid { grid-template-columns:repeat(4, 1fr); } }
  .cell { text-align:center; cursor:pointer; border-radius:12px; padding:6px 2px 8px; transition:background .2s; position:relative; }
  .cell:active { background:rgba(255,255,255,.12); }
  .cell img { width:100%; display:block; border-radius:8px; }
  .cell .nm { font-size:15px; font-weight:700; margin-top:6px; }
  .cell .en { font-size:11px; color:rgba(255,255,255,.65); margin-top:1px; }
  .cell .secret { position:absolute; top:2px; right:2px; background:#F5C542; color:#5A3A00; font-size:10px; font-weight:800; padding:2px 7px; border-radius:20px; }
  .cell.lit { background:rgba(255,217,77,.25); box-shadow:0 0 0 2px #FFD94D inset; }
  .cell.lit img { filter:brightness(1.08); }
  .cabinet { text-align:center; margin-top:26px; font-size:13px; color:rgba(255,255,255,.8); letter-spacing:1px; }
  .cabinet b { color:#FFD94D; }
  .drawbar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, rgba(38,52,80,.97), rgba(38,52,80,0)); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .drawbar button { width:100%; max-width:480px; border:none; border-radius:40px; padding:15px 0; font-size:19px; font-weight:800; letter-spacing:6px; color:#fff; background:linear-gradient(135deg,#FF7AA2,#FF4D6D); box-shadow:0 8px 22px rgba(0,0,0,.35); cursor:pointer; }
  .drawbar button:active { transform:scale(.98); }
  .drawbar .note { font-size:11px; color:rgba(255,255,255,.65); letter-spacing:1px; }
  /* shuffle overlay */
  .overlay { position:fixed; inset:0; background:rgba(30,42,66,.96); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; }
  .overlay.show { display:flex; }
  .overlay .frame { width:min(72vw,300px); aspect-ratio:1/1.35; border-radius:16px; overflow:hidden; background:#485D88; box-shadow:0 0 0 3px #FFD94D, 0 20px 60px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
  .overlay .frame img { width:100%; height:100%; object-fit:cover; }
  .overlay .frame.shake { animation:shake .12s infinite; }
  @keyframes shake { 0%{transform:rotate(-1.2deg) scale(1.02)} 50%{transform:rotate(1.2deg) scale(1.03)} 100%{transform:rotate(-1.2deg) scale(1.02)} }
  .overlay .status { font-size:17px; letter-spacing:4px; color:#fff; }
  .overlay .who { font-size:13px; color:rgba(255,255,255,.7); letter-spacing:2px; min-height:20px; }
  /* result screen */
  .result { position:fixed; inset:0; z-index:60; display:none; flex-direction:column; align-items:center; overflow-y:auto;
    background:radial-gradient(120% 90% at 50% 0%, #8A7A68 0%, #6B6156 35%, #4A443C 65%, #35302A 100%); }
  .result.show { display:flex; }
  .result .bokeh { position:absolute; border-radius:50%; background:rgba(255,255,255,.07); filter:blur(2px); pointer-events:none; }
  .result .inner { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; max-width:640px; padding:64px 20px calc(28px + env(safe-area-inset-bottom)); min-height:100%; }
  .result .congrats { font-size:19px; letter-spacing:8px; color:rgba(255,255,255,.92); margin-top:8px; }
  .result .big { font-size:52px; font-weight:800; letter-spacing:10px; margin-top:10px; text-shadow:0 4px 24px rgba(0,0,0,.4); }
  .result .en2 { font-size:14px; letter-spacing:3px; color:rgba(255,255,255,.7); margin-top:6px; }
  .result .doll { width:min(74vw,330px); margin-top:26px; filter:drop-shadow(0 24px 30px rgba(0,0,0,.45)); animation:floaty 3s ease-in-out infinite; }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .result .glow { width:min(74vw,330px); height:26px; margin-top:-6px; border-radius:50%; background:radial-gradient(closest-side, rgba(255,217,77,.55), rgba(255,217,77,0)); filter:blur(6px); }
  .result .count { margin-top:26px; font-size:14px; color:rgba(255,255,255,.85); letter-spacing:1px; }
  .result .count b { color:#FFD94D; font-size:17px; }
  .result .btns { width:100%; max-width:480px; margin-top:auto; padding-top:34px; display:flex; flex-direction:column; gap:14px; }
  .result .btns button { width:100%; border-radius:40px; padding:15px 0; font-size:18px; font-weight:800; letter-spacing:4px; cursor:pointer; }
  .result .btns .again { border:none; color:#fff; background:linear-gradient(135deg,#FF7AA2,#FF4D6D); box-shadow:0 8px 22px rgba(0,0,0,.35); }
  .result .btns .poster { background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.75); }
  .result .foot { margin-top:18px; font-size:12px; color:rgba(255,255,255,.55); letter-spacing:1px; text-align:center; }
  /* detail popup */
  .modal { position:fixed; inset:0; z-index:70; background:rgba(20,28,48,.85); display:none; align-items:center; justify-content:center; padding:24px; }
  .modal.show { display:flex; }
  .modal .card { background:#485D88; border-radius:18px; max-width:420px; width:100%; padding:20px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .modal .card img.main { width:min(64vw,240px); border-radius:12px; }
  .modal .card h3 { font-size:22px; margin-top:12px; letter-spacing:2px; }
  .modal .card .en { font-size:13px; color:rgba(255,255,255,.7); margin-top:4px; letter-spacing:1px; }
  .modal .card .extra { margin-top:14px; font-size:13px; color:#FFD94D; letter-spacing:1px; line-height:1.9; }
  .modal .card .extra img { width:120px; border-radius:10px; margin-top:8px; }
  .modal .card .close { margin-top:16px; width:100%; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:30px; padding:11px 0; font-size:15px; letter-spacing:4px; cursor:pointer; }
  /* poster modal */
  .poster-wrap { text-align:center; }
  .poster-wrap img { width:100%; max-width:360px; border-radius:12px; }
  .poster-wrap p { font-size:13px; color:rgba(255,255,255,.8); margin-top:12px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>极速<span class="bolt">⚡</span>抽盒</h1>
    <div class="sub">WISHES COME TRUE 系列 · 毛绒挂件盲盒</div>
    <div class="sim">模拟抽盒 · 仅供娱乐</div>
  </header>
  <div class="all-title">
    <div class="en">ALL CHARACTERS</div>
    <div class="cn">全款展示</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="cabinet" id="cabinet"></div>
</div>

<div class="drawbar">
  <button id="drawBtn">⚡ 立即抽盒</button>
  <div class="note">免费模拟 · 抽到喜欢的就停不下来</div>
</div>

<div class="overlay" id="overlay">
  <div class="frame shake" id="shuffleFrame"><img id="shuffleImg" alt=""></div>
  <div class="status" id="shuffleStatus">正在为你挑选…</div>
  <div class="who" id="shuffleWho"></div>
</div>

<div class="result" id="result">
  <div class="bokeh" style="width:180px;height:180px;left:-40px;top:12%"></div>
  <div class="bokeh" style="width:120px;height:120px;right:-20px;top:38%"></div>
  <div class="bokeh" style="width:220px;height:220px;left:8%;bottom:6%"></div>
  <div class="bokeh" style="width:90px;height:90px;right:12%;bottom:22%"></div>
  <div class="inner">
    <div class="congrats">恭喜抽中</div>
    <div class="big">好运精灵</div>
    <div class="en2">Lucky Twinkle</div>
    <img class="doll" id="resultDoll" alt="好运精灵">
    <div class="glow"></div>
    <div class="count" id="resultCount"></div>
    <div class="btns">
      <button class="again" id="againBtn">📦⚡ 继续抽盒</button>
      <button class="poster" id="posterBtn">生成海报图</button>
    </div>
    <div class="foot">已放入盒柜 · 好运会一直跟着你</div>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="card">
    <img class="main" id="detailImg" alt="">
    <h3 id="detailName"></h3>
    <div class="en" id="detailEn"></div>
    <div class="extra" id="detailExtra"></div>
    <button class="close" id="detailClose">知道了</button>
  </div>
</div>

<div class="modal" id="posterModal">
  <div class="card poster-wrap">
    <img id="posterImg" alt="海报">
    <p>长按图片保存 · 发给朋友一起沾沾好运</p>
    <button class="close" id="posterClose">收起来</button>
  </div>
</div>

const gridEl = document.getElementById('grid');
const cabinetEl = document.getElementById('cabinet');
function getCount(){ try { return parseInt(localStorage.getItem('luckyCount') || '0', 10) || 0; } catch(e){ return 0; } }
function setCount(n){ try { localStorage.setItem('luckyCount', String(n)); } catch(e){} }
function renderCabinet(){
  const n = getCount();
  cabinetEl.innerHTML = n > 0 ? '我的盒柜 · 已抽中 <b>好运精灵 × ' + n + '</b>' : '我的盒柜还是空的 · 快抽一个试试';
}
DOLLS.forEach(d => {
  const c = document.createElement('div');
  c.className = 'cell'; c.dataset.id = d.id;
  c.innerHTML = (d.secret ? '<div class="secret">隐藏款</div>' : '')
    + '<img src="' + d.img + '" alt="' + d.name + '" loading="lazy">'
    + '<div class="nm">' + d.name + '</div>'
    + '<div class="en">' + d.en + '</div>';
  c.addEventListener('click', () => showDetail(d));
  gridEl.appendChild(c);
});
renderCabinet();
function showDetail(d){
  document.getElementById('detailImg').src = d.img;
  document.getElementById('detailName').textContent = d.name;
  document.getElementById('detailEn').textContent = d.en + (d.secret ? ' · 隐藏款' : '');
  document.getElementById('detailExtra').innerHTML = d.secret
    ? '隐藏款 · 打开松树，里面还藏着这个小家伙<br><img src="' + GREEN_IMG + '" alt="松树里的小家伙">'
    : '';
  document.getElementById('detailModal').classList.add('show');
}
document.getElementById('detailClose').addEventListener('click', () => document.getElementById('detailModal').classList.remove('show'));
document.getElementById('detailModal').addEventListener('click', e => { if (e.target.id === 'detailModal') e.target.classList.remove('show'); });

const overlay = document.getElementById('overlay');
const shuffleImg = document.getElementById('shuffleImg');
const shuffleStatus = document.getElementById('shuffleStatus');
const shuffleWho = document.getElementById('shuffleWho');
const frame = document.getElementById('shuffleFrame');
let drawing = false;
function pickRandom(except){
  let d;
  do { d = DOLLS[Math.floor(Math.random() * DOLLS.length)]; } while (d.id === except);
  return d;
}
function lightCell(id){
  document.querySelectorAll('.cell').forEach(c => c.classList.toggle('lit', c.dataset.id === id));
}
function draw(){
  if (drawing) return;
  drawing = true;
  document.getElementById('result').classList.remove('show');
  overlay.classList.add('show');
  frame.classList.add('shake');
  shuffleStatus.textContent = '正在为你挑选…';
  shuffleWho.textContent = '';
  let last = null, step = 0;
  const totalFast = 22;
  const tick = (delay) => {
    setTimeout(() => {
      step++;
      if (step <= totalFast) {
        const d = pickRandom(last && last.id);
        last = d;
        shuffleImg.src = d.img;
        shuffleWho.textContent = d.name + ' · ' + d.en;
        lightCell(d.id);
        tick(step < totalFast - 4 ? 90 : 170);
      } else {
        const prize = DOLLS.find(d => d.id === PRIZE);
        shuffleImg.src = prize.img;
        shuffleWho.textContent = prize.name + ' · ' + prize.en;
        lightCell(PRIZE);
        frame.classList.remove('shake');
        shuffleStatus.textContent = '就是它了！';
        setTimeout(showResult, 750);
      }
    }, delay);
  };
  tick(60);
}
function showResult(){
  overlay.classList.remove('show');
  lightCell(null);
  const n = getCount() + 1;
  setCount(n);
  renderCabinet();
  document.getElementById('resultDoll').src = LUCKY_CUT;
  document.getElementById('resultCount').innerHTML = '已放入盒柜 · 这是你第 <b>' + n + '</b> 次抽中好运精灵';
  document.getElementById('result').classList.add('show');
  window.scrollTo(0, 0);
  drawing = false;
}
document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('result').classList.remove('show');
  draw();
});
document.getElementById('posterBtn').addEventListener('click', makePoster);
document.getElementById('posterClose').addEventListener('click', () => document.getElementById('posterModal').classList.remove('show'));
function makePoster(){
  const W = 900, H = 1280;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8A7A68'); g.addColorStop(0.5, '#5A534A'); g.addColorStop(1, '#35302A');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  [[120,220,150],[760,420,110],[180,980,190],[740,1020,130]].forEach(c => { ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 7); ctx.fill(); });
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '600 44px sans-serif';
  ctx.fillText('恭 喜 抽 中', W/2, 150);
  ctx.font = '800 110px sans-serif';
  ctx.fillText('好运精灵', W/2, 290);
  ctx.font = '400 30px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('Lucky Twinkle', W/2, 340);
  const img = new Image();
  img.onload = () => {
    const dw = 520, dh = 520 * img.height / img.width;
    ctx.drawImage(img, (W - dw)/2, 400, dw, dh);
    ctx.font = '400 28px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('第 ' + getCount() + ' 次抽中 · 好运会一直跟着你', W/2, 400 + dh + 70);
    ctx.font = '400 24px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('WISHES COME TRUE · 模拟抽盒', W/2, H - 70);
    document.getElementById('posterImg').src = cv.toDataURL('image/png');
    document.getElementById('posterModal').classList.add('show');
  };
  img.src = LUCKY_CUT;
}
</script>
